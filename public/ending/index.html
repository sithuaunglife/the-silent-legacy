<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Silent Legacy — Story Ending</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       CORE RESET & RETRO ARCADE VIEWPORT
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #03050a;
      font-family: 'Press Start 2P', monospace;
      color: #f8fafc;
    }

    /* ==========================================================================
       CRT MONITOR HOUSING & FULL-SCREEN SHADER OVERLAYS
       ========================================================================== */
    #crt-monitor {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #040814;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Main Pixel Canvas */
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* WebGL Post-Processing Shader Overlay (Subtle RGB Shift & Phosphor Curvature) */
    #crt-gl-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 15;
      mix-blend-mode: screen;
      opacity: 0.42;
    }

    /* Scanlines + RGB Aperture Grille */
    .crt-scanlines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      background:
        linear-gradient(
          rgba(18, 16, 16, 0) 50%,
          rgba(0, 0, 0, 0.34) 50%
        ),
        linear-gradient(
          90deg,
          rgba(255, 0, 0, 0.045),
          rgba(0, 255, 0, 0.015),
          rgba(0, 0, 255, 0.045)
        );
      background-size: 100% 4px, 6px 100%;
    }

    /* Subtle CRT Flicker & Rolling Sync Bar */
    .crt-rolling-bar {
      position: absolute;
      left: 0;
      width: 100%;
      height: 14%;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0) 0%,
        rgba(140, 220, 255, 0.045) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      pointer-events: none;
      z-index: 21;
      animation: crtRoll 8s linear infinite;
    }

    @keyframes crtRoll {
      0% { top: -15%; }
      100% { top: 115%; }
    }

    /* Curved Screen Bezel Vignette & Phosphor Bloom */
    .crt-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 25;
      box-shadow:
        inset 0 0 85px rgba(0, 0, 0, 0.78),
        inset 0 0 24px rgba(0, 180, 255, 0.14);
      border-radius: 18px;
    }

    /* ==========================================================================
       ARCADE HUD & CONTROLS (TOP BAR)
       ========================================================================== */
    .hud-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: clamp(12px, 2.2vw, 24px);
      pointer-events: none;
      text-shadow: 2px 2px 0px #000, -1px -1px 0px #000, 0 0 10px rgba(56, 189, 248, 0.7);
    }

    .hud-telemetry {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: clamp(9px, 1.3vw, 12px);
      color: #bae6fd;
      letter-spacing: 0.06em;
    }

    .hud-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(5, 14, 30, 0.72);
      border: 2px solid rgba(56, 189, 248, 0.55);
      padding: 6px 10px;
      border-radius: 6px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.65);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
      animation: pulseDot 1s steps(2, end) infinite;
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .hud-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      pointer-events: auto;
    }

    .origin-selector {
      display: inline-flex;
      background: rgba(5, 14, 30, 0.88);
      border: 2px solid #38bdf8;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 4px 0 #0369a1;
    }

    .origin-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(8px, 1.05vw, 10px);
      color: #94a3b8;
      background: transparent;
      border: none;
      padding: 8px 10px;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .origin-btn:hover {
      color: #ffffff;
      background: rgba(56, 189, 248, 0.18);
    }

    .origin-btn.active-moon {
      background: #0284c7;
      color: #ffffff;
      text-shadow: 1px 1px 0 #000;
    }

    .origin-btn.active-mars {
      background: #c2410c;
      color: #fef08a;
      text-shadow: 1px 1px 0 #000;
    }

    .arcade-mini-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(8px, 1.1vw, 11px);
      color: #e0f2fe;
      background: rgba(7, 19, 38, 0.85);
      border: 2px solid #38bdf8;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 0 #0369a1, 0 0 12px rgba(56, 189, 248, 0.35);
      transition: transform 0.08s ease, background 0.15s ease;
    }

    .arcade-mini-btn:hover {
      background: #0c4a6e;
      color: #ffffff;
    }

    .arcade-mini-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #0369a1;
    }

    /* ==========================================================================
       PHASE SUBTITLE BANNER (BOTTOM TELEMETRY CALLOUTS)
       ========================================================================== */
    #phase-banner {
      position: absolute;
      bottom: clamp(18px, 4vh, 36px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 28;
      background: rgba(4, 11, 24, 0.82);
      border: 2px solid rgba(125, 211, 252, 0.6);
      border-radius: 8px;
      padding: 10px 18px;
      font-size: clamp(9px, 1.35vw, 13px);
      color: #fde047;
      text-align: center;
      white-space: nowrap;
      text-shadow: 2px 2px 0 #000, 0 0 8px rgba(250, 204, 21, 0.6);
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.7);
      transition: opacity 0.4s ease, transform 0.4s ease;
      pointer-events: none;
    }

    #phase-banner.hidden {
      opacity: 0;
      transform: translate(-50%, 16px);
    }

    /* ==========================================================================
       VICTORY / ENDING OVERLAY MODAL
       ========================================================================== */
    #victory-overlay {
      position: absolute;
      inset: 0;
      z-index: 35;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 3vw, 28px);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    #victory-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .victory-card {
      width: min(94vw, 760px);
      background: linear-gradient(180deg, rgba(6, 16, 36, 0.90) 0%, rgba(4, 11, 26, 0.94) 100%);
      border: 4px solid #38bdf8;
      border-radius: 14px;
      padding: clamp(18px, 3.5vw, 34px);
      box-shadow:
        0 0 0 4px #020617,
        0 0 36px rgba(56, 189, 248, 0.45),
        inset 0 0 24px rgba(14, 165, 233, 0.22);
      text-align: center;
      position: relative;
      transform: translateY(16px) scale(0.97);
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #victory-overlay.visible .victory-card {
      transform: translateY(0) scale(1);
    }

    /* Pixel Corner Rivets */
    .corner-rivet {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #fde047;
      box-shadow: 0 0 8px #facc15;
    }
    .corner-rivet.tl { top: 8px; left: 8px; }
    .corner-rivet.tr { top: 8px; right: 8px; }
    .corner-rivet.bl { bottom: 8px; left: 8px; }
    .corner-rivet.br { bottom: 8px; right: 8px; }

    .game-title-tag {
      font-size: clamp(10px, 1.4vw, 13px);
      color: #38bdf8;
      letter-spacing: 0.24em;
      margin-bottom: 10px;
      text-shadow: 2px 2px 0 #000, 0 0 10px rgba(56, 189, 248, 0.8);
    }

    .mission-complete-header {
      font-size: clamp(18px, 3.6vw, 34px);
      line-height: 1.25;
      color: #fde047;
      margin-bottom: 16px;
      text-shadow:
        3px 3px 0 #9a3412,
        -1px -1px 0 #000,
        0 0 18px rgba(250, 204, 21, 0.75);
      animation: titleGlow 2s ease-in-out infinite alternate;
    }

    @keyframes titleGlow {
      from {
        text-shadow: 3px 3px 0 #9a3412, -1px -1px 0 #000, 0 0 12px rgba(250, 204, 21, 0.55);
      }
      to {
        text-shadow: 3px 3px 0 #9a3412, -1px -1px 0 #000, 0 0 24px rgba(253, 224, 71, 0.95);
      }
    }

    .congrats-box {
      min-height: clamp(64px, 11vh, 92px);
      background: rgba(2, 8, 20, 0.75);
      border: 2px solid rgba(148, 163, 184, 0.35);
      border-radius: 8px;
      padding: clamp(12px, 2vw, 18px);
      margin-bottom: 18px;
      font-size: clamp(9px, 1.35vw, 13px);
      line-height: 1.75;
      color: #f1f5f9;
      text-shadow: 2px 2px 0 #000;
    }

    .cursor-block {
      display: inline-block;
      width: 9px;
      height: 13px;
      background: #4ade80;
      vertical-align: middle;
      margin-left: 4px;
      animation: blinkCursor 0.7s steps(2, end) infinite;
    }

    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Retro Arcade Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 22px;
      text-align: left;
    }

    @media (max-width: 540px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }

    .stat-item {
      background: rgba(15, 23, 42, 0.78);
      border: 2px solid rgba(56, 189, 248, 0.35);
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .stat-label {
      font-size: clamp(8px, 1.05vw, 10px);
      color: #94a3b8;
    }

    .stat-value {
      font-size: clamp(10px, 1.3vw, 13px);
      color: #4ade80;
      text-shadow: 1px 1px 0 #000;
    }

    .stat-value.gold {
      color: #fde047;
    }

    .stat-value.cyan {
      color: #38bdf8;
    }

    /* Action Buttons */
    .victory-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
    }

    .arcade-btn {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(10px, 1.35vw, 13px);
      padding: 13px 20px;
      border-radius: 8px;
      cursor: pointer;
      border: 3px solid;
      transition: transform 0.08s ease, filter 0.15s ease;
      text-transform: uppercase;
    }

    .arcade-btn-primary {
      background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
      border-color: #86efac;
      color: #ffffff;
      text-shadow: 2px 2px 0 #052e16;
      box-shadow: 0 5px 0 #14532d, 0 0 18px rgba(74, 222, 128, 0.5);
      animation: pressStartPulse 1.4s ease-in-out infinite;
    }

    @keyframes pressStartPulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.22); }
    }

    .arcade-btn-secondary {
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      border-color: #7dd3fc;
      color: #ffffff;
      text-shadow: 2px 2px 0 #082f49;
      box-shadow: 0 5px 0 #0c4a6e, 0 0 16px rgba(56, 189, 248, 0.45);
    }

    .arcade-btn:hover {
      filter: brightness(1.15);
    }

    .arcade-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #000;
    }

    /* Toast Message Box (Replaces alert) */
    #arcade-toast {
      position: absolute;
      top: 72px;
      left: 50%;
      transform: translate(-50%, -12px);
      z-index: 45;
      background: #0f172a;
      border: 3px solid #fde047;
      color: #fde047;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: clamp(9px, 1.2vw, 12px);
      text-shadow: 2px 2px 0 #000;
      box-shadow: 0 6px 0 #000, 0 0 20px rgba(250, 204, 21, 0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #arcade-toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }
  </style>

  <style id="integrated-ending-theme">
  /* 2.5D NASA mission palette; ending uses the same pixel-spaceplane
     as Earth launch instead of the original white rocket placeholder. */
  html,body,#crt-monitor{background:#030915;color:#d8efff}
  #crt-monitor{box-shadow:inset 0 0 95px #071a33}
  .crt-scanlines{opacity:.38}
  .crt-rolling-bar{opacity:.24}
  #crt-gl-canvas{opacity:.16}
  .crt-vignette{box-shadow:inset 0 0 65px #010714a8;border-radius:0}
  .hud-top{font-family:ui-monospace,'VT323',monospace}
  .hud-badge{background:#06172acc;border:1px solid #558db5}
  .origin-selector,#btn-download-zip,#btn-skip,#btn-replay,#btn-switch-origin,#btn-continue,#btn-audio{display:none!important}
  .victory-card{
    background:linear-gradient(155deg,#081d32f5,#040c1af7);
    border:2px solid #5eb7e2;border-radius:12px;
    box-shadow:0 0 55px #1a80b14d,inset 0 0 38px #144e6440;
  }
  .mission-complete-header{color:#b9edff;text-shadow:0 0 22px #23aaff88}
  .game-title-tag{color:#78c8f5}
  .arcade-btn-primary{
    background:linear-gradient(#117d9b,#0a4b72);
    border-color:#92dcff;box-shadow:0 4px #062c46,0 0 25px #159ad288
  }
  .stats-grid .stat-item{border:1px solid #4e7894;background:#041729e8}
  .stat-value.gold,.stat-value.cyan{color:#9fdaf6}
  @media(max-width:600px){.hud-top{padding:10px}.victory-card{padding:16px}
    .victory-actions{gap:6px}.arcade-btn-primary{font-size:10px}}
  </style>
</head>
<body>
  <div id="crt-monitor">
    <!-- Crisp Low-Res Pixel Art Canvas scaled up cleanly -->
    <canvas id="game-canvas" width="594" height="270"></canvas>

    <!-- WebGL Post-Process Chromatic & Curvature Glow Shader Canvas -->
    <canvas id="crt-gl-canvas" width="880" height="400"></canvas>

    <!-- CRT Scanline, Rolling Bar, and Bezel Vignette Layers -->
    <div class="crt-scanlines"></div>
    <div class="crt-rolling-bar"></div>
    <div class="crt-vignette"></div>

    <!-- Top Retro Telemetry & Sound/Skip Controls -->
    <header class="hud-top">
      <div class="hud-telemetry">
        <div class="hud-badge">
          <span class="status-dot"></span>
          <span id="scene-badge-text">SCENE 1/3 // LUNA DEPARTURE</span>
        </div>
        <div class="hud-badge" id="telemetry-readout"><span>LUNA EVA // APPROACHING LANDER</span></div>
      </div>

      <div class="hud-controls">
        <div class="origin-selector" role="group" aria-label="Select Mission Origin">
          <button id="btn-origin-moon" class="origin-btn active-moon" title="Launch Ending from Moon (Key 1)">
            [1] MOON
          </button>
          <button id="btn-origin-mars" class="origin-btn" title="Launch Ending from Mars (Key 2)">
            [2] MARS
          </button>
        </div>
        <button id="btn-audio" class="arcade-mini-btn" title="Toggle Retro Chiptune &amp; SFX">
          SOUND: ON
        </button>
        <button id="btn-download-zip" class="arcade-mini-btn" title="Download Project as .ZIP for VS Code">
          ⬇ .ZIP
        </button>
        <button id="btn-skip" class="arcade-mini-btn" title="Skip to Splashdown / Victory">
          SKIP &gt;&gt;
        </button>
      </div>
    </header>

    <!-- Toast Notification Banner -->
    <div id="arcade-toast" role="status" aria-live="polite"></div>

    <!-- Bottom Phase Narrative Banner -->
    <div id="phase-banner">[SCENE 1/3] ASTRONAUT BOARDING CAPSULE ON LUNAR SURFACE</div>

    <!-- Victory & Ending Credits Card -->
    <section id="victory-overlay" aria-label="Story Complete Victory Screen">
      <div class="victory-card">
        <span class="corner-rivet tl"></span>
        <span class="corner-rivet tr"></span>
        <span class="corner-rivet bl"></span>
        <span class="corner-rivet br"></span>

        <div class="game-title-tag">★ SILENT LEGACY — ENDING ★</div>
        <h1 class="mission-complete-header">STORY COMPLETE</h1>

        <div class="congrats-box">
          <span id="typewriter-text"></span><span class="cursor-block" id="typewriter-cursor"></span>
        </div>

        <div class="stats-grid">
          <div class="stat-item">
            <span class="stat-label">MISSION ORIGIN</span>
            <span class="stat-value gold" id="stat-origin-val">LUNA BASE (MOON)</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">SPLASHDOWN ZONE</span>
            <span class="stat-value cyan">PACIFIC OCEAN (14°N)</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">LEGACY DATA CORE</span>
            <span class="stat-value">100% RECOVERED</span>
          </div>
          <div class="stat-item">
            <span class="stat-label">PILOT RANK</span>
            <span class="stat-value gold">★ S-CLASS LEGEND ★</span>
          </div>
        </div>

        <div class="victory-actions">
          <button id="btn-replay" class="arcade-btn arcade-btn-secondary">
            ↺ REPLAY 3-SCENE ENDING
          </button>
          <button id="btn-switch-origin" class="arcade-btn arcade-btn-secondary">⇄ PLAY MARS ENDING</button>
          <button id="btn-continue" class="arcade-btn arcade-btn-primary">
            ↻ RESTART STORY
          </button>
        </div>
      </div>
    </section>
  </div>

  <script>
    /**
     * ==========================================================================
     * SILENT LEGACY — 3-SCENE 2.5D PIXEL-ART ARCADE ENDING ENGINE
     * ==========================================================================
     * Scene 1: Surface Boarding & Liftoff (MOON or MARS selectable)
     *          - Astronaut walks/hops across 2.5D regolith/canyon terrain, climbs
     *            ladder into ship, hatch seals, thrusters ignite, vertical liftoff.
     * Scene 2: Deep Space Orbital Transit
     *          - Multi-layer starfield, shrinking Moon/Mars behind, growing pixel
     *            Earth ahead as the spacecraft aligns for atmospheric entry.
     * Scene 3: Earth Re-Entry, Parachute & Pacific Ocean Splashdown
     *          - Plasma re-entry -> striped parachute deployment -> splashdown ->
     *            bobbing recovery beacon & STORY COMPLETE arcade overlay.
     */

    (() => {
      'use strict';

      // ------------------------------------------------------------------------
      // DOM REFERENCES
      // ------------------------------------------------------------------------
      const canvas = document.getElementById('game-canvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const glCanvas = document.getElementById('crt-gl-canvas');

      const sceneBadgeEl = document.getElementById('scene-badge-text');
      const telemetryEl = document.getElementById('telemetry-readout');
      const phaseBannerEl = document.getElementById('phase-banner');
      const victoryOverlayEl = document.getElementById('victory-overlay');
      const typewriterTextEl = document.getElementById('typewriter-text');
      const statOriginEl = document.getElementById('stat-origin-val');
      const toastEl = document.getElementById('arcade-toast');

      const btnOriginMoon = document.getElementById('btn-origin-moon');
      const btnOriginMars = document.getElementById('btn-origin-mars');
      const btnAudio = document.getElementById('btn-audio');
      const btnDownloadZip = document.getElementById('btn-download-zip');
      const btnSkip = document.getElementById('btn-skip');
      const btnReplay = document.getElementById('btn-replay');
      const btnSwitchOrigin = document.getElementById('btn-switch-origin');
      const btnContinue = document.getElementById('btn-continue');

      // ------------------------------------------------------------------------
      // VIRTUAL PIXEL RESOLUTION (16:9 Crisp Pixel Grid)
      // ------------------------------------------------------------------------
      const BASE_HEIGHT = 270;
      let VW = 480;
      let VH = 270;

      function resizeCanvas() {
        const aspect = window.innerWidth / Math.max(1, window.innerHeight);
        VH = BASE_HEIGHT;
        VW = Math.max(320, Math.round(VH * aspect));
        canvas.width = VW;
        canvas.height = VH;
        ctx.imageSmoothingEnabled = false;

        glCanvas.width = Math.floor(window.innerWidth / 2);
        glCanvas.height = Math.floor(window.innerHeight / 2);
        initSceneEntities();
      }

      // ------------------------------------------------------------------------
      // WEBGL CRT SHADER OVERLAY (Chromatic Aberration + Phosphor Vignette)
      // ------------------------------------------------------------------------
      let gl = null;
      let glProgram = null;
      let glTimeLoc = null;

      function initCRTShader() {
        try {
          gl = glCanvas.getContext('webgl') || glCanvas.getContext('experimental-webgl');
          if (!gl) return;

          const vsSource = `
            attribute vec2 a_pos;
            varying vec2 v_uv;
            void main() {
              v_uv = a_pos * 0.5 + 0.5;
              gl_Position = vec4(a_pos, 0.0, 1.0);
            }
          `;

          const fsSource = `
            precision mediump float;
            varying vec2 v_uv;
            uniform float u_time;

            vec2 curveUV(vec2 uv) {
              uv = uv * 2.0 - 1.0;
              vec2 offset = abs(uv.yx) / vec2(5.5, 4.5);
              uv = uv + uv * offset * offset;
              uv = uv * 0.5 + 0.5;
              return uv;
            }

            void main() {
              vec2 uv = curveUV(v_uv);
              if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {
                gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);
                return;
              }

              // Subtle phosphor grille + warm/cool chromatic edge sheen
              float dist = distance(uv, vec2(0.5));
              float edgeGlow = smoothstep(0.25, 0.85, dist);
              float scan = sin(uv.y * 540.0 + u_time * 4.0) * 0.5 + 0.5;
              float r = edgeGlow * 0.16 * scan;
              float g = (1.0 - edgeGlow) * 0.06;
              float b = edgeGlow * 0.24;

              gl_FragColor = vec4(r, g, b, 0.35);
            }
          `;

          const compile = (type, src) => {
            const s = gl.createShader(type);
            gl.shaderSource(s, src);
            gl.compileShader(s);
            return s;
          };

          const vs = compile(gl.VERTEX_SHADER, vsSource);
          const fs = compile(gl.FRAGMENT_SHADER, fsSource);
          glProgram = gl.createProgram();
          gl.attachShader(glProgram, vs);
          gl.attachShader(glProgram, fs);
          gl.linkProgram(glProgram);
          gl.useProgram(glProgram);

          const buf = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, buf);
          gl.bufferData(
            gl.ARRAY_BUFFER,
            new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]),
            gl.STATIC_DRAW
          );

          const posLoc = gl.getAttribLocation(glProgram, 'a_pos');
          gl.enableVertexAttribArray(posLoc);
          gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);
          glTimeLoc = gl.getUniformLocation(glProgram, 'u_time');
        } catch (err) {
          gl = null;
        }
      }

      function renderCRTShader(t) {
        if (!gl || !glProgram) return;
        gl.viewport(0, 0, glCanvas.width, glCanvas.height);
        gl.uniform1f(glTimeLoc, t);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }

      // RETRO WEB AUDIO API SYNTHESIZER (8-BIT / 16-BIT SFX & VICTORY FANFARE)
      // ------------------------------------------------------------------------
      class RetroAudioEngine {
        constructor() {
          this.ctx = null;
          // All ending audio is controlled by the global parent sound
          // toggle. Avoid an independent iframe AudioContext/duplicate sounds.
          this.enabled = false;
          this.fanfarePlayed = false;
          this.noiseBuffer = null;
        }

        ensureContext() {
          if (!this.enabled) return false;
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return false;
            this.ctx = new AudioCtx();
            this.createNoiseBuffer();
          }
          if (this.ctx.state === 'suspended') {
            this.ctx.resume().catch(() => {});
          }
          return true;
        }

        createNoiseBuffer() {
          if (!this.ctx) return;
          const length = this.ctx.sampleRate * 2.0;
          const buffer = this.ctx.createBuffer(1, length, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < length; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          this.noiseBuffer = buffer;
        }

        toggle() {
          this.enabled = !this.enabled;
          if (this.enabled) {
            this.ensureContext();
            this.playBeep(660, 0.08, 'square', 0.08);
          }
          return this.enabled;
        }

        playBeep(freq, duration, type = 'square', vol = 0.08, delay = 0) {
          if (!this.ensureContext()) return;
          const now = this.ctx.currentTime + delay;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(vol, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + duration + 0.02);
        }

        playParachuteDeploy() {
          if (!this.ensureContext() || !this.noiseBuffer) return;
          const now = this.ctx.currentTime;

          // Crisp filtered noise "WHOOMP"
          const src = this.ctx.createBufferSource();
          src.buffer = this.noiseBuffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(180, now);
          filter.frequency.exponentialRampToValueAtTime(620, now + 0.14);
          filter.frequency.exponentialRampToValueAtTime(140, now + 0.45);
          filter.Q.value = 1.4;

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.22, now + 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.48);

          src.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          src.start(now);
          src.stop(now + 0.5);

          // Retro confirmation chime
          this.playBeep(523.25, 0.09, 'square', 0.06, 0.05);
          this.playBeep(783.99, 0.14, 'square', 0.06, 0.14);
        }

        playSplashdown() {
          if (!this.ensureContext() || !this.noiseBuffer) return;
          const now = this.ctx.currentTime;

          // White-noise water splash burst
          const src = this.ctx.createBufferSource();
          src.buffer = this.noiseBuffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1400, now);
          filter.frequency.exponentialRampToValueAtTime(240, now + 0.85);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.28, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);

          src.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          src.start(now);
          src.stop(now + 0.95);

          // Low sub thud
          const osc = this.ctx.createOscillator();
          const oGain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(130, now);
          osc.frequency.exponentialRampToValueAtTime(42, now + 0.35);
          oGain.gain.setValueAtTime(0.22, now);
          oGain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
          osc.connect(oGain);
          oGain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.4);
        }

        playThrusterIgnite() {
          if (!this.ensureContext() || !this.noiseBuffer) return;
          const now = this.ctx.currentTime;

          const src = this.ctx.createBufferSource();
          src.buffer = this.noiseBuffer;

          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(220, now);
          filter.frequency.linearRampToValueAtTime(780, now + 0.45);
          filter.frequency.exponentialRampToValueAtTime(160, now + 2.2);

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.22, now + 0.3);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 2.3);

          src.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          src.start(now);
          src.stop(now + 2.35);

          this.playBeep(110, 0.25, 'sawtooth', 0.06, 0);
          this.playBeep(146.83, 0.35, 'sawtooth', 0.06, 0.18);
        }

        playHatchSeal() {
          this.playBeep(330, 0.07, 'square', 0.06, 0);
          this.playBeep(493.88, 0.11, 'square', 0.06, 0.08);
        }

        playVictoryFanfare() {
          if (this.fanfarePlayed || !this.ensureContext()) return;
          this.fanfarePlayed = true;

          // Classic 16-bit Arcade Ending Victory Melody (C Major Heroic Cadence)
          const melody = [
            { f: 523.25, d: 0.13, t: 0.00 }, // C5
            { f: 659.25, d: 0.13, t: 0.14 }, // E5
            { f: 783.99, d: 0.13, t: 0.28 }, // G5
            { f: 1046.50, d: 0.34, t: 0.42 }, // C6
            { f: 880.00, d: 0.16, t: 0.80 }, // A5
            { f: 1046.50, d: 0.55, t: 0.98 }, // C6
            // Secondary warm harmonic phrase
            { f: 783.99, d: 0.16, t: 1.62 }, // G5
            { f: 880.00, d: 0.16, t: 1.80 }, // A5
            { f: 987.77, d: 0.16, t: 1.98 }, // B5
            { f: 1046.50, d: 0.75, t: 2.16 }  // C6
          ];

          const bass = [
            { f: 130.81, d: 0.38, t: 0.00 }, // C3
            { f: 196.00, d: 0.38, t: 0.42 }, // G3
            { f: 174.61, d: 0.35, t: 0.80 }, // F3
            { f: 130.81, d: 0.55, t: 1.16 }, // C3
            { f: 196.00, d: 0.50, t: 1.62 }, // G3
            { f: 261.63, d: 0.75, t: 2.16 }  // C4
          ];

          melody.forEach(n => this.playBeep(n.f, n.d, 'square', 0.075, n.t));
          bass.forEach(n => this.playBeep(n.f, n.d, 'triangle', 0.09, n.t));
        }

        reset() {
          this.fanfarePlayed = false;
        }
      }
