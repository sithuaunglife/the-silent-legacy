        phaseBannerEl.textContent = isMoon
          ? '[SCENE 1/3] ASTRONAUT BOARDING CAPSULE ON LUNAR SURFACE'
          : '[SCENE 1/3] ASTRONAUT BOARDING CAPSULE ON MARTIAN SURFACE';
        audio.reset();
      }

      function enterScene(newScene) {
        state.scene = newScene;
        state.sceneTime = 0;
        state.particles = [];

        if (newScene === SCENES.SPACE_TRANSIT) {
          state.transit.progress = 0;
          window.parent.postMessage({type:'silent-ending-sfx',sound:'orbit'},window.location.origin);
          sceneBadgeEl.textContent = 'SCENE 2/3 // DEEP SPACE TRANSIT';
          phaseBannerEl.classList.remove('hidden');
          phaseBannerEl.textContent =
            state.origin === ORIGINS.MARS
              ? '[SCENE 2/3] INTERPLANETARY CRUISE — MARS TO EARTH TRAJECTORY'
              : '[SCENE 2/3] TRANSLUNAR INJECTION — RETURNING TO EARTH ORBIT';
        } else if (newScene === SCENES.EARTH_LANDING) {
          state.phase = PHASES.REENTRY;
          state.phaseTime = 0;
          state.cameraY = -170;
          state.ship.x = VW * 0.16;
          state.ship.y = 48;
          state.ship.angle = 0.56;
          state.ship.heatIntensity = 1.0;
          state.ship.chuteOpen = 0;
          state.ship.chuteDeflate = 0;
          state.ship.inWater = false;
          window.parent.postMessage({type:'silent-ending-sfx',sound:'mission'},window.location.origin);

          sceneBadgeEl.textContent = 'SCENE 3/3 // EARTH SPLASHDOWN';
          phaseBannerEl.classList.remove('hidden');
          phaseBannerEl.textContent = '[SCENE 3/3] ATMOSPHERIC RE-ENTRY — HEAT SHIELD ENGAGED';
        }
      }

      function skipToVictory() {
        audio.ensureContext();
        state.scene = SCENES.EARTH_LANDING;
        state.transitionAlpha = 0;
        state.cameraY = 0;
        state.ship.x = VW * 0.5;
        state.ship.y = state.oceanHorizonY + 18;
        state.ship.angle = 0;
        state.ship.heatIntensity = 0;
        state.ship.chuteOpen = 1;
        state.ship.chuteDeflate = 1;
        state.ship.inWater = true;

        sceneBadgeEl.textContent = 'SCENE 3/3 // EARTH SPLASHDOWN';

        if (state.phase !== PHASES.VICTORY) {
          spawnSplashdownEffects(state.ship.x, state.ship.y);
          audio.playSplashdown();
        }

        enterPhase(PHASES.VICTORY);
        const fullMsg = getCongratsMessage(state.origin);
        state.typewriterIndex = fullMsg.length;
        typewriterTextEl.textContent = fullMsg;
      }

      function enterPhase(newPhase) {
        state.phase = newPhase;
        state.phaseTime = 0;

        if (newPhase === PHASES.PARACHUTE) {
          phaseBannerEl.textContent = '[SCENE 3/3] MAIN PARACHUTE DEPLOYED — DESCENT STABILIZED';
          audio.playParachuteDeploy();
          state.shakeTime = 0.25;
          state.shakeMag = 2.5;
        } else if (newPhase === PHASES.SPLASHDOWN) {
          phaseBannerEl.textContent = '[SCENE 3/3] SPLASHDOWN CONFIRMED — PACIFIC OCEAN RECOVERY';
          audio.playSplashdown();
          window.parent.postMessage({type:'silent-ending-sfx',sound:'touchdown'},window.location.origin);
          state.shakeTime = 0.38;
          state.shakeMag = 3.5;
          spawnSplashdownEffects(state.ship.x, state.ship.y);
        } else if (newPhase === PHASES.VICTORY) {
          phaseBannerEl.classList.add('hidden');
          victoryOverlayEl.classList.add('visible');
          audio.playVictoryFanfare();
          window.parent.postMessage({type:'silent-ending-complete'},window.location.origin);
        }
      }

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => {
          toastEl.classList.remove('show');
        }, 2600);
      }

      // ------------------------------------------------------------------------
      // PARTICLE & SPLASHDOWN GENERATORS
      // ------------------------------------------------------------------------
      function spawnReentryPlasma(x, y) {
        for (let i = 0; i < 4; i++) {
          const isCore = Math.random() < 0.45;
          state.particles.push({
            x: x + (Math.random() - 0.5) * 10,
            y: y + (Math.random() - 0.5) * 8,
            vx: -35 - Math.random() * 45,
            vy: -25 - Math.random() * 35,
            life: 0.28 + Math.random() * 0.25,
            maxLife: 0.53,
            size: isCore ? 3 : 2,
            color: isCore ? '#fef08a' : (Math.random() < 0.5 ? '#fb923c' : '#ef4444')
          });
        }
      }

      function spawnSplashdownEffects(x, y) {
        // Multi-tiered crisp pixel water droplets
        for (let i = 0; i < 44; i++) {
          const spread = (Math.random() - 0.5) * 2.2;
          const speed = 35 + Math.random() * 75;
          state.splashDroplets.push({
            x: x + (Math.random() - 0.5) * 14,
            y: y - 2,
            vx: Math.sin(spread) * speed,
            vy: -Math.abs(Math.cos(spread)) * speed - 18,
            size: Math.random() < 0.35 ? 3 : 2,
            color: Math.random() < 0.55 ? '#ffffff' : '#bae6fd',
            waterY: y + 2
          });
        }

        // Expanding 2.5D elliptical ocean foam rings
        state.foamRings.push(
          { x, y: y + 3, rx: 8, ry: 2, alpha: 1.0, speed: 26 },
          { x, y: y + 4, rx: 4, ry: 1, alpha: 0.85, speed: 17 }
        );
      }

      // ------------------------------------------------------------------------
      // SIMULATION UPDATE LOOP (60 FPS DELTA-TIME)
      // ------------------------------------------------------------------------
      function update(dt) {
        state.time += dt;
        state.sceneTime += dt;
        state.phaseTime += dt;

        if (state.shakeTime > 0) {
          state.shakeTime = Math.max(0, state.shakeTime - dt);
        }

        // Update generic particles
        for (let i = state.particles.length - 1; i >= 0; i--) {
          const p = state.particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= dt;
          if (p.life <= 0) state.particles.splice(i, 1);
        }

        // ======================================================================
        // SCENE 1: SURFACE BOARDING & LIFTOFF (MOON OR MARS)
        // ======================================================================
        if (state.scene === SCENES.SURFACE_LAUNCH) {
          const shipPadX = Math.round(VW * 0.56);
          const ladderX = shipPadX - 10;
          const isMoon = state.origin === ORIGINS.MOON;

          // Update surface dust clouds
          for (let i = state.surface.dustPuffs.length - 1; i >= 0; i--) {
            const d = state.surface.dustPuffs[i];
            d.x += d.vx * dt;
            d.y += d.vy * dt;
            d.r += 9 * dt;
            d.life -= dt;
            if (d.life <= 0) state.surface.dustPuffs.splice(i, 1);
          }

          if (state.surface.astroStage === 'WALK') {
            // Astronaut walks/low-g bounds toward ship boarding ladder
            const walkSpeed = isMoon ? 34 : 38;
            state.surface.astroX += walkSpeed * dt;
            state.surface.astroStep += dt * (isMoon ? 7.5 : 9.5);

            // Low-gravity bounce arc
            const bounceFreq = isMoon ? 7.5 : 9.5;
            const bounceAmp = isMoon ? 3.2 : 1.6;
            state.surface.astroY =
              state.surface.groundY - Math.abs(Math.sin(state.surface.astroStep)) * bounceAmp;

            // Footstep dust kicks
            if (Math.random() < 0.14) {
              state.surface.dustPuffs.push({
                x: state.surface.astroX - 2,
                y: state.surface.groundY,
                vx: -8 - Math.random() * 10,
                vy: -3 - Math.random() * 5,
                r: 2,
                life: 0.45,
                maxLife: 0.45
              });
            }

            telemetryEl.innerHTML = isMoon
              ? '<span>LUNA EVA // APPROACHING LANDER</span>'
              : '<span>MARS EVA // APPROACHING LANDER</span>';

            if (state.surface.astroX >= ladderX) {
              state.surface.astroX = ladderX;
              state.surface.astroY = state.surface.groundY;
              state.surface.astroStage = 'CLIMB';
              phaseBannerEl.textContent = '[SCENE 1/3] BOARDING SPACECRAFT — SEALING AIRLOCK';
            }
          } else if (state.surface.astroStage === 'CLIMB') {
            // Astronaut climbs ladder into spacecraft hatch
            state.surface.climbProgress += dt * 1.15;
            state.surface.astroY = state.surface.groundY - Math.min(1, state.surface.climbProgress) * 18;
            state.surface.astroX = ladderX + Math.min(1, state.surface.climbProgress) * 8;

            if (state.surface.climbProgress >= 1.0) {
              state.surface.astroStage = 'BOARDED';
              state.surface.hatchOpen = 0;
              audio.playHatchSeal();
              audio.playThrusterIgnite();
              phaseBannerEl.textContent = isMoon
                ? '[SCENE 1/3] IGNITION! LAUNCHING FROM THE MOON TO EARTH'
                : '[SCENE 1/3] IGNITION! LAUNCHING FROM MARS TO EARTH';
            }
          } else if (state.surface.astroStage === 'BOARDED') {
            // Thruster spool-up & vertical launch into starry sky
            state.surface.thrusterPower = Math.min(1, state.surface.thrusterPower + dt * 1.6);

            if (state.surface.thrusterPower > 0.35) {
              const accel = Math.pow(state.surface.thrusterPower - 0.35, 1.55) * 195;
              state.surface.liftoffOffset += accel * dt;
              state.shakeTime = 0.08;
              state.shakeMag = 1.6 * state.surface.thrusterPower;
            }

            const shipCurrentY = state.surface.groundY - 18 - state.surface.liftoffOffset;

            // Exhaust flames & billowing surface dust
            for (let i = 0; i < 4; i++) {
              state.particles.push({
                x: shipPadX + (Math.random() - 0.5) * 10,
                y: shipCurrentY + 12,
                vx: (Math.random() - 0.5) * 28,
                vy: 45 + Math.random() * 55,
                life: 0.28 + Math.random() * 0.2,
                maxLife: 0.48,
                size: Math.random() < 0.5 ? 3 : 2,
                color: Math.random() < 0.45 ? '#fef08a' : (isMoon ? '#38bdf8' : '#fb923c')
              });
            }

            if (state.surface.liftoffOffset < 75 && Math.random() < 0.45) {
              const dir = Math.random() < 0.5 ? -1 : 1;
              state.surface.dustPuffs.push({
                x: shipPadX + dir * (6 + Math.random() * 14),
                y: state.surface.groundY,
                vx: dir * (24 + Math.random() * 36),
                vy: -4 - Math.random() * 12,
                r: 4 + Math.random() * 3,
                life: 0.75,
                maxLife: 0.75
              });
            }

            const altKm = (state.surface.liftoffOffset * 0.35).toFixed(1);
            telemetryEl.innerHTML = `<span>ASCENT ALT: ${altKm} KM | THRUST: 100%</span>`;

            // Fade to black briefly once ship clears the top of the screen
            if (shipCurrentY < -35) {
              state.transitionAlpha = Math.min(1, state.transitionAlpha + dt * 2.4);
              if (state.transitionAlpha >= 1) {
                enterScene(SCENES.SPACE_TRANSIT);
              }
            }
          }
          return;
        }

        // ======================================================================
        // SCENE 2: DEEP SPACE TRANSIT TO EARTH
        // ======================================================================
        if (state.scene === SCENES.SPACE_TRANSIT) {
          state.transitionAlpha = Math.max(0, state.transitionAlpha - dt * 2.4);
          const duration = 5.2;
          state.transit.progress = Math.min(1, state.sceneTime / duration);

          // Scroll multi-layer parallax starfield leftwards
          state.stars.forEach(st => {
            st.x -= st.speed * dt * (1 + state.transit.progress * 0.8);
            if (st.x < 0) st.x += VW;
          });

          // Scroll passing asteroids
          state.transit.asteroids.forEach(ast => {
            ast.x -= ast.speed * dt;
            if (ast.x < -12) {
              ast.x = VW + 12;
              ast.y = 28 + Math.random() * (VH - 56);
            }
          });

          // Spacecraft trajectory arching from left (Moon/Mars) toward Earth on right
          const p = state.transit.progress;
          const shipX = VW * (0.22 + p * 0.52);
          const shipY = VH * 0.52 - Math.sin(p * Math.PI) * 26;

          // Engine ion trail particles
          for (let i = 0; i < 3; i++) {
            state.particles.push({
              x: shipX - 11,
              y: shipY + (Math.random() - 0.5) * 4,
              vx: -55 - Math.random() * 45,
              vy: (Math.random() - 0.5) * 10,
              life: 0.25 + Math.random() * 0.2,
              maxLife: 0.45,
              size: Math.random() < 0.5 ? 2 : 1,
              color: Math.random() < 0.5 ? '#38bdf8' : '#fef08a'
            });
          }

          const distEarth = Math.max(400, Math.round((1 - p) * (state.origin === ORIGINS.MARS ? 54600000 : 384400)));
          telemetryEl.innerHTML = `<span>EARTH DIST: ${distEarth.toLocaleString()} KM</span>`;

          if (p >= 0.88) {
            state.transitionAlpha = Math.min(1, (p - 0.88) / 0.12);
          }

          if (p >= 1) {
            enterScene(SCENES.EARTH_LANDING);
          }
          return;
        }

        // ======================================================================
        // SCENE 3: EARTH RE-ENTRY, PARACHUTE & PACIFIC SPLASHDOWN
        // ======================================================================
        state.transitionAlpha = Math.max(0, state.transitionAlpha - dt * 2.2);

        // Scroll clouds & sparkles continuously
        state.clouds.forEach(c => {
          c.x += c.speed * dt;
          if (c.x - c.w > VW + 20) {
            c.x = -c.w - 15;
          }
        });

        state.sparkles.forEach(s => {
          s.phase += s.speed * dt;
          s.x -= 6 * dt;
          if (s.x < 0) s.x += VW;
        });

        state.seagulls.forEach(g => {
          g.x += g.speed * dt;
          g.wingPhase += 6.5 * dt;
          if (g.x > VW + 20) g.x = -20;
        });

        // Update splash water droplets
        for (let i = state.splashDroplets.length - 1; i >= 0; i--) {
          const d = state.splashDroplets[i];
          d.x += d.vx * dt;
          d.y += d.vy * dt;
          d.vy += 175 * dt; // Gravity
          if (d.y >= d.waterY && d.vy > 0) {
            state.splashDroplets.splice(i, 1);
          }
        }

        // Update expanding water foam rings
        for (let i = state.foamRings.length - 1; i >= 0; i--) {
          const r = state.foamRings[i];
          r.rx += r.speed * dt;
          r.ry += (r.speed * 0.28) * dt;
          r.alpha -= 0.42 * dt;
          if (r.alpha <= 0) state.foamRings.splice(i, 1);
        }

        // Phase-specific choreography
        const targetShipX = VW * 0.5;
        const splashY = state.oceanHorizonY + 18;

        if (state.phase === PHASES.REENTRY) {
          // Smooth camera descent from upper space into blue sky
          const progress = Math.min(1, state.phaseTime / 4.2);
          state.cameraY = -170 * Math.pow(1 - progress, 1.35);

          // Diagonal trajectory toward center sky
          state.ship.x += (targetShipX - state.ship.x) * 0.72 * dt;
          state.ship.y = 48 + progress * 54;
          state.ship.angle = 0.56 * (1 - progress * 0.65);
          state.ship.heatIntensity = Math.max(0, 1 - progress * 1.15);

          if (state.ship.heatIntensity > 0.08) {
            spawnReentryPlasma(state.ship.x + 8, state.ship.y + 8);
            if (Math.random() < 0.35) {
              state.shakeTime = 0.06;
              state.shakeMag = 1.2 * state.ship.heatIntensity;
            }
          }

          // Update HUD telemetry
          const alt = Math.max(14.5, 120 - progress * 105.5).toFixed(1);
          const mach = Math.max(0.8, 7.8 - progress * 7.0).toFixed(1);
          telemetryEl.innerHTML = `<span>ALT: ${alt} KM | VEL: MACH ${mach}</span>`;

          if (state.phaseTime >= 4.2) {
            enterPhase(PHASES.PARACHUTE);
          }
        } else if (state.phase === PHASES.PARACHUTE) {
          state.cameraY += (0 - state.cameraY) * 4 * dt;

          // Inflate parachute rapidly with slight elastic overshoot
          state.ship.chuteOpen = Math.min(1, state.ship.chuteOpen + dt * 2.8);

          // Harmonic pendulum sway under parachute
          state.ship.chuteSway = Math.sin(state.phaseTime * 2.4) * 0.16 * Math.exp(-state.phaseTime * 0.14);
          state.ship.angle = state.ship.chuteSway * 0.85;

          // Gentle horizontal drift & steady parachute descent to ocean
          state.ship.x += (targetShipX - state.ship.x) * 1.4 * dt + Math.sin(state.phaseTime * 2.4) * 5 * dt;
          const remainingDist = splashY - state.ship.y;
          state.ship.y += Math.max(15.5, remainingDist * 0.58) * dt;

          const alt = Math.max(0.0, ((splashY - state.ship.y) / 86) * 14.5).toFixed(1);
          telemetryEl.innerHTML = `<span>ALT: ${alt} KM | CHUTE: DEPLOYED</span>`;

          if (state.ship.y >= splashY) {
            state.ship.y = splashY;
            state.ship.inWater = true;
            enterPhase(PHASES.SPLASHDOWN);
          }
        } else if (state.phase === PHASES.SPLASHDOWN) {
          // Capsule settles into the waves, parachute gently deflates onto the ocean
          state.ship.bobPhase += dt * 3.2;
          state.ship.chuteDeflate = Math.min(1, state.ship.chuteDeflate + dt * 0.65);

          const settleDamp = Math.exp(-state.phaseTime * 1.8);
          const dip = Math.sin(state.phaseTime * 6.5) * 4.5 * settleDamp;
          state.ship.y = splashY + dip + Math.sin(state.ship.bobPhase) * 1.6;
          state.ship.angle = Math.sin(state.phaseTime * 4.5) * 0.14 * settleDamp + Math.cos(state.ship.bobPhase * 0.8) * 0.04;
          state.ship.beaconTimer += dt;

          telemetryEl.innerHTML = `<span>ALT: 0.0 KM | STATUS: SPLASHDOWN OK</span>`;

          if (state.phaseTime >= 2.2) {
            enterPhase(PHASES.VICTORY);
          }
        } else if (state.phase === PHASES.VICTORY) {
          // Gentle continuous ocean bobbing & recovery beacon blink
          state.ship.bobPhase += dt * 2.4;
          state.ship.y = splashY + Math.sin(state.ship.bobPhase) * 1.8;
          state.ship.angle = Math.cos(state.ship.bobPhase * 0.75) * 0.045;
          state.ship.beaconTimer += dt;

          // Periodic gentle ocean foam ripples around floating capsule
          if (Math.random() < 0.035) {
            state.foamRings.push({
              x: state.ship.x,
              y: state.ship.y + 4,
              rx: 9,
              ry: 2,
              alpha: 0.55,
              speed: 10
            });
          }

          // Typewriter effect for congratulations text
          const fullMsg = getCongratsMessage(state.origin);
          if (state.typewriterIndex < fullMsg.length) {
            state.typewriterTimer += dt;
            while (state.typewriterTimer >= 0.024 && state.typewriterIndex < fullMsg.length) {
              state.typewriterTimer -= 0.024;
              state.typewriterIndex++;
              typewriterTextEl.textContent = fullMsg.slice(0, state.typewriterIndex);
              if (state.typewriterIndex % 3 === 0) {
                audio.playBeep(880, 0.025, 'square', 0.018);
              }
            }
          }
        }
      }

      // ------------------------------------------------------------------------
      // SCENE 1 RENDERER: MOON OR MARS SURFACE BOARDING & LIFTOFF
      // ------------------------------------------------------------------------
      function drawScene1SurfaceLaunch() {
        const isMoon = state.origin === ORIGINS.MOON;
        const groundY = state.surface.groundY;

        // 1. Sky Backdrop
        if (isMoon) {
          // Crisp deep-space lunar black-indigo sky
          ctx.fillStyle = '#030612';
          ctx.fillRect(0, 0, VW, VH);

          state.stars.forEach(st => {
            if (st.y < groundY) {
              const alpha = 0.5 + 0.5 * Math.sin(state.time * 3 + st.twinkle);
              ctx.fillStyle = st.color;
              ctx.globalAlpha = alpha;
              ctx.fillRect(Math.round(st.x), Math.round(st.y), st.size, st.size);
            }
          });
          ctx.globalAlpha = 1;

          // Distant Blue Earth hanging in the Lunar Sky (Destination!)
          const ex = Math.round(VW * 0.22);
          const ey = Math.round(VH * 0.24);
          ctx.fillStyle = 'rgba(56, 189, 248, 0.18)';
          drawPixelCircle(ex, ey, 18);
          ctx.fillStyle = '#0284c7';
          drawPixelCircle(ex, ey, 13);
          // Continents & cloud swirls
          ctx.fillStyle = '#22c55e';
          ctx.fillRect(ex - 5, ey - 4, 6, 5);
          ctx.fillRect(ex + 2, ey + 1, 5, 6);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(ex - 8, ey - 7, 9, 2);
          ctx.fillRect(ex - 2, ey + 5, 8, 2);
        } else {
          // Dusty Salmon / Amber Martian Sky
          const marsSky = ctx.createLinearGradient(0, 0, 0, groundY);
          marsSky.addColorStop(0, '#2b0d09');
          marsSky.addColorStop(0.45, '#7c2d12');
          marsSky.addColorStop(0.82, '#c2410c');
          marsSky.addColorStop(1, '#fdba74');
          ctx.fillStyle = marsSky;
          ctx.fillRect(0, 0, VW, VH);

          // Faint high-altitude stars + Phobos moon
          state.stars.slice(0, 30).forEach(st => {
            if (st.y < groundY * 0.42) {
              ctx.fillStyle = 'rgba(254, 243, 199, 0.45)';
              ctx.fillRect(Math.round(st.x), Math.round(st.y), 1, 1);
            }
          });

          // Distant Pale Blue Dot (Earth) + Phobos
          const ex = Math.round(VW * 0.22);
          const ey = Math.round(VH * 0.22);
          ctx.fillStyle = '#7dd3fc';
          ctx.fillRect(ex, ey, 2, 2);
          ctx.fillStyle = '#d6d3d1';
          drawPixelCircle(Math.round(VW * 0.78), Math.round(VH * 0.2), 5);
        }

        // 2. 2.5D Distant Ridge / Mesas
        if (isMoon) {
          ctx.fillStyle = '#1e293b';
          for (let x = 0; x < VW; x += 2) {
            const h = Math.round(12 + Math.sin(x * 0.025) * 6 + Math.cos(x * 0.06) * 4);
            ctx.fillRect(x, groundY - h, 2, h);
          }
        } else {
          // Stratified Martian red-ochre mesas
          ctx.fillStyle = '#7c2d12';
          ctx.fillRect(Math.round(VW * 0.06), groundY - 22, 68, 22);
          ctx.fillRect(Math.round(VW * 0.12), groundY - 28, 48, 6);
          ctx.fillStyle = '#9a3412';
          ctx.fillRect(Math.round(VW * 0.72), groundY - 26, 84, 26);
          ctx.fillRect(Math.round(VW * 0.77), groundY - 33, 56, 7);
        }

        // 3. Foreground 2.5D Regolith / Red Sand Terrain
        const groundGrad = ctx.createLinearGradient(0, groundY, 0, VH);
        if (isMoon) {
          groundGrad.addColorStop(0, '#94a3b8');
          groundGrad.addColorStop(0.25, '#64748b');
          groundGrad.addColorStop(1, '#334155');
        } else {
          groundGrad.addColorStop(0, '#ea580c');
          groundGrad.addColorStop(0.28, '#c2410c');
          groundGrad.addColorStop(1, '#7c2d12');
        }
        ctx.fillStyle = groundGrad;
        ctx.fillRect(0, groundY, VW, VH - groundY);

        // Horizon rim highlight
        ctx.fillStyle = isMoon ? '#cbd5e1' : '#fed7aa';
        ctx.fillRect(0, groundY, VW, 1);

        // Craters & surface rocks
        state.surface.craters.forEach(c => {
          ctx.fillStyle = isMoon ? '#475569' : '#9a3412';
          ctx.beginPath();
          ctx.ellipse(c.x, c.y, c.rx, c.ry, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = isMoon ? '#cbd5e1' : '#fdba74';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.ellipse(c.x, c.y + 1, c.rx, c.ry, 0, 0, Math.PI);
          ctx.stroke();
        });

        state.surface.rocks.forEach(rk => {
          ctx.fillStyle = isMoon ? '#334155' : '#431407';
          ctx.fillRect(rk.x, rk.y, rk.w, rk.h);
          ctx.fillStyle = isMoon ? '#cbd5e1' : '#fb923c';
          ctx.fillRect(rk.x, rk.y, rk.w - 1, 1);
        });

        // 4. Landed Spaceship + Boarding Ladder
        const shipPadX = Math.round(VW * 0.56);
        const shipY = Math.round(groundY - 18 - state.surface.liftoffOffset);

        // Boarding ladder (remains on pad or retracts on liftoff)
        if (state.surface.liftoffOffset < 6) {
          const lx = shipPadX - 10;
          ctx.fillStyle = '#fde047';
          ctx.fillRect(lx, groundY - 16, 1, 16);
          ctx.fillRect(lx + 4, groundY - 16, 1, 16);
          for (let ry = groundY - 14; ry < groundY; ry += 3) {
            ctx.fillRect(lx, ry, 5, 1);
          }
        }

        // Draw Lander Legs (retract slightly after liftoff)
        if (state.surface.liftoffOffset < 28) {
          ctx.fillStyle = '#cbd5e1';
          ctx.fillRect(shipPadX - 12, shipY + 7, 3, 11);
          ctx.fillRect(shipPadX + 9, shipY + 7, 3, 11);
          ctx.fillStyle = '#fde047';
          ctx.fillRect(shipPadX - 14, shipY + 17, 6, 2);
          ctx.fillRect(shipPadX + 8, shipY + 17, 6, 2);
        }

        // Exhaust particles behind ship
        state.particles.forEach(p => {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
          ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
        });
        ctx.globalAlpha = 1;

        // Draw Spaceship Body
        drawSpacecraftSprite(shipPadX, shipY, 0, state.surface.thrusterPower > 0.1);

        // Open Hatch Glow if astronaut hasn't sealed it yet
        if (state.surface.hatchOpen > 0) {
          ctx.fillStyle = '#fde047';
          ctx.fillRect(shipPadX - 5, shipY - 1, 3, 5);
        }

        // 5. Pixel Astronaut EVA Sprite (before boarding completes)
        if (state.surface.astroStage !== 'BOARDED') {
          drawAstronautSprite(
            Math.round(state.surface.astroX),
            Math.round(state.surface.astroY),
            state.surface.astroStep
          );
        }

        // 6. Surface Dust Puffs
        state.surface.dustPuffs.forEach(d => {
          ctx.fillStyle = isMoon
            ? `rgba(203, 213, 225, ${Math.max(0, d.life / d.maxLife) * 0.65})`
            : `rgba(253, 186, 116, ${Math.max(0, d.life / d.maxLife) * 0.65})`;
          drawPixelCircle(Math.round(d.x), Math.round(d.y), Math.round(d.r));
        });
      }

      // ------------------------------------------------------------------------
      // SCENE 2 RENDERER: DEEP SPACE TRANSIT FROM MOON/MARS TO EARTH
      // ------------------------------------------------------------------------
      const orbitPlanetArt={moon:new Image(),mars:new Image(),earth:new Image()};
      orbitPlanetArt.moon.src='../assets/archive-inline-0.png';
      orbitPlanetArt.mars.src='../assets/archive-inline-3.png';
      orbitPlanetArt.earth.src='../assets/archive-inline-2.png';
      function drawOrbitPlanet(image,x,y,r,fallback){
        ctx.save();
        ctx.shadowColor='rgba(61,158,228,.24)';ctx.shadowBlur=Math.min(22,r*.23);
        if(image.complete&&image.naturalWidth){
          ctx.imageSmoothingEnabled=false;ctx.drawImage(image,x-r,y-r,r*2,r*2);
        }else{ctx.fillStyle=fallback;drawPixelCircle(x,y,r);}
        ctx.restore();
      }
      function drawScene2SpaceTransit() {
        const isMoon = state.origin === ORIGINS.MOON;
        const p = state.transit.progress;

        // Deep Space Backdrop
        ctx.fillStyle = '#02040c';
        ctx.fillRect(0, 0, VW, VH);

        // Subtle Galactic Nebula Band
        const nebGrad = ctx.createLinearGradient(0, 0, VW, VH);
        nebGrad.addColorStop(0, 'rgba(30, 58, 138, 0.18)');
        nebGrad.addColorStop(0.5, isMoon ? 'rgba(14, 165, 233, 0.12)' : 'rgba(234, 88, 12, 0.14)');
        nebGrad.addColorStop(1, 'rgba(15, 23, 42, 0.1)');
        ctx.fillStyle = nebGrad;
        ctx.fillRect(0, 0, VW, VH);

        // Parallax Stars
        state.stars.forEach(st => {
          ctx.fillStyle = st.color;
          ctx.fillRect(Math.round(st.x), Math.round(st.y), st.size, st.size);
        });

        // Re-use the 2.5D orbital planet artwork instead of placeholder circles.
        const originRadius=Math.max(5,Math.round(45*(1-p*.78)));
        const originX=Math.round(VW*.16-p*35);
        const originY=Math.round(VH*.62);
        drawOrbitPlanet(isMoon?orbitPlanetArt.moon:orbitPlanetArt.mars,originX,originY,originRadius,isMoon?'#aab6c7':'#ac5a39');
        const earthRadius=Math.round(28+p*76);
        drawOrbitPlanet(orbitPlanetArt.earth,Math.round(VW*.84),Math.round(VH*.46),earthRadius,'#165c9f');

        // Passing Pixel Asteroids
        state.transit.asteroids.forEach(ast => {
          ctx.fillStyle = '#64748b';
          ctx.fillRect(Math.round(ast.x), Math.round(ast.y), ast.size, ast.size);
          ctx.fillStyle = '#cbd5e1';
          ctx.fillRect(Math.round(ast.x), Math.round(ast.y), Math.max(1, ast.size - 1), 1);
        });

        // Ion Thruster Trail Particles
        state.particles.forEach(pt => {
          ctx.fillStyle = pt.color;
          ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
          ctx.fillRect(Math.round(pt.x), Math.round(pt.y), pt.size, pt.size);
        });
        ctx.globalAlpha = 1;

        // Cruising Spaceship pointed right toward Earth
        const shipX = Math.round(VW * (0.22 + p * 0.52));
        const shipY = Math.round(VH * 0.52 - Math.sin(p * Math.PI) * 26);
        drawSpacecraftSprite(shipX, shipY, 0, true, true);
      }

      // ------------------------------------------------------------------------
      // SHARED PIXEL SPRITE HELPERS (ASTRONAUT & SPACECRAFT)
      // ------------------------------------------------------------------------
      function drawAstronautSprite(x, y, stepPhase) {
        const legSwing = Math.round(Math.sin(stepPhase) * 2);
        // Backpack PLSS
        ctx.fillStyle = '#cbd5e1';
        ctx.fillRect(x - 4, y - 11, 3, 6);
        // White EVA Torso
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(x - 2, y - 11, 5, 6);
        // Helmet & Gold Reflective Visor
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(x - 2, y - 16, 6, 5);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(x + 1, y - 15, 3, 3);
        // Animated Legs
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(x - 2 + legSwing, y - 5, 2, 5);
        ctx.fillRect(x + 1 - legSwing, y - 5, 2, 5);
      }

      const storyShip = {
        vertical: new Image(),
        transit: new Image()
      };
      storyShip.vertical.src = '../launch/assets/spacecraft-upright.png';
      storyShip.transit.src = '../launch/assets/spacecraft-cruise.png';
      function paintStoryShip(image,halfWidth,halfHeight) {
        if(!image.complete || !image.naturalWidth) return;
        ctx.save();
        ctx.imageSmoothingEnabled=false;
        const scale=Math.min(halfWidth*2/image.naturalWidth,halfHeight*2/image.naturalHeight);
        const w=image.naturalWidth*scale,h=image.naturalHeight*scale;
        ctx.drawImage(image,-w/2,-h/2,w,h);
        ctx.restore();
      }
      function drawSpacecraftSprite(sx,sy,angle,thrusterOn,cruising=false) {
        ctx.save();
        ctx.translate(sx,sy);
        ctx.rotate(angle);
        if(cruising)ctx.scale(-1,1); // mirrored return ship, not a 90-degree flip
        if(thrusterOn){
          const flicker=Math.sin(state.time*47)*3;
          ctx.fillStyle='#58d3ff';
          ctx.fillRect(cruising?12:-5,cruising?-4:11,cruising?12:10,cruising?7:10+flicker);
          ctx.fillStyle='#d6fbff';
          ctx.fillRect(cruising?12:-2,cruising?-2:10,cruising?7:4,cruising?4:5+flicker*.4);
        }
        paintStoryShip(cruising?storyShip.transit:storyShip.vertical,cruising?29:21,cruising?21:26);
        ctx.restore();
      }

      // ------------------------------------------------------------------------
      // 2.5D PIXEL-ART RENDERING PIPELINE
      // ------------------------------------------------------------------------
      function drawSkyAndAtmosphere() {
        // Interpolate sky palette from deep space (cameraY = -170) to crisp Pacific blue (cameraY = 0)
        const spaceFactor = Math.max(0, Math.min(1, -state.cameraY / 170));

        const grad = ctx.createLinearGradient(0, 0, 0, state.oceanHorizonY);
        if (spaceFactor > 0.05) {
          grad.addColorStop(0, lerpColor('#0284c7', '#02040d', spaceFactor));
          grad.addColorStop(0.55, lerpColor('#38bdf8', '#0c1e4a', spaceFactor));
          grad.addColorStop(0.88, lerpColor('#bae6fd', '#ea580c', spaceFactor * 0.75));
          grad.addColorStop(1, lerpColor('#fef3c7', '#fde047', spaceFactor * 0.8));
        } else {
          // Crisp sunny Pacific Ocean sky
          grad.addColorStop(0, '#0369a1');
          grad.addColorStop(0.45, '#0ea5e9');
          grad.addColorStop(0.82, '#7dd3fc');
          grad.addColorStop(1, '#e0f2fe');
        }

        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, VW, VH);

        // Twinkling upper-atmosphere stars
        if (spaceFactor > 0.05) {
          state.stars.forEach(st => {
            const alpha = spaceFactor * (0.45 + 0.55 * Math.sin(state.time * 4 + st.twinkle));
            ctx.fillStyle = st.color;
            ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
            ctx.fillRect(Math.round(st.x), Math.round(st.y - state.cameraY * 0.25), st.size, st.size);
          });
          ctx.globalAlpha = 1;
        }

        // Pixel Sun & Atmospheric Halo near horizon
        const sunX = Math.round(VW * 0.78);
        const sunY = Math.round(state.oceanHorizonY - 46 - state.cameraY * 0.55);
        if (sunY < state.oceanHorizonY + 12) {
          // Outer pixel glow rings
          ctx.fillStyle = 'rgba(254, 240, 138, 0.22)';
          drawPixelCircle(sunX, sunY, 22);
          ctx.fillStyle = 'rgba(254, 249, 195, 0.45)';
          drawPixelCircle(sunX, sunY, 15);
          ctx.fillStyle = '#fef9c3';
          drawPixelCircle(sunX, sunY, 10);
        }

        // 2.5D Parallax Pixel Clouds
        state.clouds.forEach(c => {
          const parallaxY = c.y - state.cameraY * (c.layer === 0 ? 0.65 : 0.85);
          if (parallaxY > -20 && parallaxY < state.oceanHorizonY - 6) {
            drawPixelCloud(Math.round(c.x), Math.round(parallaxY), c.w, c.h, c.layer);
          }
        });

        // Distant Pacific Atoll / Island Silhouette on the Horizon
        const horizonScreenY = Math.round(state.oceanHorizonY - state.cameraY);
        if (horizonScreenY < VH + 10) {
          const islX = Math.round(VW * 0.18);
          ctx.fillStyle = '#1e3a5f';
          ctx.fillRect(islX, horizonScreenY - 3, 38, 3);
          ctx.fillRect(islX + 6, horizonScreenY - 6, 24, 3);
          ctx.fillRect(islX + 12, horizonScreenY - 8, 11, 2);
        }

        // Distant Seagulls flying low over the Pacific
        if (spaceFactor < 0.25) {
          ctx.fillStyle = '#f8fafc';
          state.seagulls.forEach(g => {
            const gx = Math.round(g.x);
            const gy = Math.round(g.y - state.cameraY);
            const flap = Math.sin(g.wingPhase) > 0 ? -1 : 1;
            ctx.fillRect(gx, gy, 2, 1);
            ctx.fillRect(gx - 2, gy + flap, 2, 1);
            ctx.fillRect(gx + 2, gy + flap, 2, 1);
          });
        }
      }

      function drawPixelCloud(x, y, w, h, layer) {
        ctx.fillStyle = layer === 0 ? '#bae6fd' : '#ffffff';
        ctx.fillRect(x, y, w, h);
        ctx.fillRect(x + 4, y - 3, w - 8, 3);
        ctx.fillRect(x + 9, y - 5, Math.max(6, w - 18), 2);
        // Subtle sunlit underside shadow
        ctx.fillStyle = layer === 0 ? '#7dd3fc' : '#cbd5e1';
        ctx.fillRect(x + 2, y + h - 2, w - 4, 2);
      }

      function draw25DOcean() {
        const horizonY = Math.round(state.oceanHorizonY - state.cameraY);
        if (horizonY >= VH) return;

        // Base clean deep-to-tropical Pacific blue gradient
        const waterGrad = ctx.createLinearGradient(0, horizonY, 0, VH);
        waterGrad.addColorStop(0, '#0284c7');
        waterGrad.addColorStop(0.35, '#0369a1');
        waterGrad.addColorStop(0.75, '#075985');
        waterGrad.addColorStop(1, '#0c4a6e');
        ctx.fillStyle = waterGrad;
        ctx.fillRect(0, horizonY, VW, VH - horizonY);

        // Crisp bright horizon shimmer line
        ctx.fillStyle = '#bae6fd';
        ctx.fillRect(0, horizonY, VW, 1);

        // Sun reflection column on the water
        const sunX = Math.round(VW * 0.78);
        for (let row = horizonY + 2; row < VH; row += 3) {
          const depth = (row - horizonY) / Math.max(1, VH - horizonY);
          const shimmerW = Math.round(6 + depth * 22 + Math.sin(state.time * 5 + row * 0.4) * 5);
          const offsetX = Math.round(Math.sin(state.time * 3 + row * 0.25) * 4);
          ctx.fillStyle = depth < 0.35 ? 'rgba(254, 249, 195, 0.55)' : 'rgba(186, 230, 253, 0.28)';
          ctx.fillRect(sunX - Math.floor(shimmerW / 2) + offsetX, row, shimmerW, 1);
        }

        // 4 Layered 2.5D Parallax Wave Bands (Perspective-scaled amplitude & speed)
        const waveLayers = [
          { yOff: 6,  amp: 1.2, freq: 0.07, speed: 1.4, color: '#0ea5e9', crest: '#7dd3fc' },
          { yOff: 22, amp: 1.8, freq: 0.055, speed: 2.2, color: '#0284c7', crest: '#bae6fd' },
          { yOff: 44, amp: 2.5, freq: 0.042, speed: 3.1, color: '#0369a1', crest: '#e0f2fe' },
          { yOff: 68, amp: 3.2, freq: 0.032, speed: 4.2, color: '#075985', crest: '#ffffff' }
        ];

        waveLayers.forEach((wl, idx) => {
          const baseY = horizonY + wl.yOff;
          if (baseY >= VH) return;

          ctx.fillStyle = wl.color;
          for (let x = 0; x < VW; x += 2) {
            const wy = Math.round(
              baseY +
              Math.sin(x * wl.freq + state.time * wl.speed + idx) * wl.amp +
              Math.cos(x * wl.freq * 0.5 - state.time * wl.speed * 0.7) * (wl.amp * 0.5)
            );
            ctx.fillRect(x, wy, 2, VH - wy);

            // Pixel whitecap / specular crest highlights on wave peaks
            if (Math.sin(x * wl.freq + state.time * wl.speed + idx) > 0.72) {
              ctx.fillStyle = wl.crest;
              ctx.fillRect(x, wy, 2, 1);
              ctx.fillStyle = wl.color;
            }
          }
        });

        // Specular water sparkles
        state.sparkles.forEach(sp => {
          const sy = Math.round(sp.y - state.cameraY);
          if (sy > horizonY + 2 && sy < VH) {
            const blink = Math.sin(sp.phase);
            if (blink > 0.65) {
              ctx.fillStyle = blink > 0.88 ? '#ffffff' : '#bae6fd';
              ctx.fillRect(Math.round(sp.x), sy, 2, 1);
              if (blink > 0.92) {
                ctx.fillRect(Math.round(sp.x), sy - 1, 1, 3);
              }
            }
          }
        });

        // Expanding 2.5D elliptical foam rings around splashdown zone
        state.foamRings.forEach(r => {
          const ryScreen = Math.round(r.y - state.cameraY);
          ctx.strokeStyle = `rgba(255, 255, 255, ${Math.max(0, r.alpha)})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.ellipse(Math.round(r.x), ryScreen, Math.round(r.rx), Math.max(1, Math.round(r.ry)), 0, 0, Math.PI * 2);
          ctx.stroke();
        });
      }

      function drawParachuteAndCapsule() {
        const sx = Math.round(state.ship.x);
        const sy = Math.round(state.ship.y - state.cameraY);

        // 1. Draw Retro Pixel Parachute (if deployed)
        if (state.ship.chuteOpen > 0.01) {
          const open = state.ship.chuteOpen;
          const deflate = state.ship.chuteDeflate;

          // Canopy settles gracefully onto the ocean surface after splashdown
          const canopyOffsetX = Math.round(Math.sin(state.ship.chuteSway) * 26 + deflate * 28);
          const canopyOffsetY = Math.round(-36 * open * (1 - deflate * 0.88) + deflate * 6);
          const cx = sx + canopyOffsetX;
          const cy = sy + canopyOffsetY;

          const canopyW = Math.round((38 * open) * (1 + deflate * 0.18));
          const canopyH = Math.round((20 * open) * (1 - deflate * 0.65));

          // Suspension Cords (before canopy settles fully)
          if (deflate < 0.85) {
            ctx.strokeStyle = 'rgba(241, 245, 249, 0.85)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(sx - 2, sy - 7);
            ctx.lineTo(cx - Math.floor(canopyW * 0.42), cy + Math.floor(canopyH * 0.4));
            ctx.moveTo(sx + 2, sy - 7);
            ctx.lineTo(cx + Math.floor(canopyW * 0.42), cy + Math.floor(canopyH * 0.4));
            ctx.moveTo(sx, sy - 7);
            ctx.lineTo(cx, cy + Math.floor(canopyH * 0.4));
            ctx.stroke();
          }

          // Pixel-art striped retro orange & white parachute dome
          const halfW = Math.max(4, Math.floor(canopyW / 2));
          const h = Math.max(3, canopyH);
          for (let py = 0; py < h; py++) {
            const normY = py / h;
            const rowHalfW = Math.max(2, Math.round(halfW * Math.sin((1 - normY * 0.72) * Math.PI * 0.5)));
            for (let px = -rowHalfW; px < rowHalfW; px++) {
              // Alternating international aerospace orange & crisp white panels
              const stripe = Math.floor(((px + rowHalfW) / Math.max(1, rowHalfW * 2)) * 5);
              if (py === h - 1) {
                ctx.fillStyle = '#9a3412'; // Bottom rim trim
              } else if (stripe % 2 === 0) {
                ctx.fillStyle = py < h * 0.35 ? '#fb923c' : '#ea580c';
              } else {
                ctx.fillStyle = py < h * 0.35 ? '#ffffff' : '#e2e8f0';
              }
              ctx.fillRect(cx + px, cy - h + py, 1, 1);
            }
          }
        }

        // 2. Draw SILENT LEGACY Spaceship / Re-entry Capsule
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(state.ship.angle);

        // Re-entry Plasma Heat Shield Glow (Phase 1)
        if (state.ship.heatIntensity > 0.05) {
          const glowR = Math.round(14 + Math.sin(state.time * 40) * 2);
          ctx.fillStyle = `rgba(251, 146, 60, ${0.35 * state.ship.heatIntensity})`;
          drawPixelCircle(0, 4, glowR);
          ctx.fillStyle = `rgba(254, 240, 138, ${0.75 * state.ship.heatIntensity})`;
          ctx.fillRect(-9, 6, 18, 3);
        }

        // Same source asset as the initial launch, Moon and Mars lander.
        paintStoryShip(storyShip.vertical,20,24);

        // Recovery Beacon Light (blinks brightly once in the Pacific Ocean)
        if (state.ship.inWater) {
          const blinkOn = Math.sin(state.ship.beaconTimer * 8) > 0.1;
          ctx.fillStyle = blinkOn ? '#4ade80' : '#166534';
          ctx.fillRect(-1, -12, 2, 2);
          if (blinkOn) {
            ctx.fillStyle = 'rgba(74, 222, 128, 0.35)';
            drawPixelCircle(0, -11, 5);
          }
        }

        ctx.restore();

        // Waterline occlusion & gentle foam collar when floating in the ocean
        if (state.ship.inWater) {
          ctx.fillStyle = '#0369a1';
          ctx.fillRect(sx - 11, sy + 5, 22, 6);
          ctx.fillStyle = '#e0f2fe';
          const collarW = 16 + Math.round(Math.sin(state.time * 4) * 2);
          ctx.fillRect(sx - Math.floor(collarW / 2), sy + 4, collarW, 1);
        }
      }

      function drawParticles() {
        // Re-entry plasma embers
        state.particles.forEach(p => {
          ctx.fillStyle = p.color;
          ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
          ctx.fillRect(Math.round(p.x), Math.round(p.y - state.cameraY), p.size, p.size);
        });
        ctx.globalAlpha = 1;

        // Splashdown water droplets
        state.splashDroplets.forEach(d => {
          ctx.fillStyle = d.color;
          ctx.fillRect(Math.round(d.x), Math.round(d.y - state.cameraY), d.size, d.size);
        });
      }

      // ------------------------------------------------------------------------
      // UTILITY DRAWING HELPERS
      // ------------------------------------------------------------------------
      function drawPixelCircle(cx, cy, r) {
        for (let y = -r; y <= r; y++) {
          const w = Math.round(Math.sqrt(r * r - y * y));
          ctx.fillRect(cx - w, cy + y, w * 2, 1);
        }
      }

      function lerpColor(hexA, hexB, t) {
        const a = parseInt(hexA.slice(1), 16);
        const b = parseInt(hexB.slice(1), 16);
        const rA = (a >> 16) & 255, gA = (a >> 8) & 255, bA = a & 255;
        const rB = (b >> 16) & 255, gB = (b >> 8) & 255, bB = b & 255;
        const r = Math.round(rA + (rB - rA) * t);
        const g = Math.round(gA + (gB - gA) * t);
        const bl = Math.round(bA + (bB - bA) * t);
        return `rgb(${r}, ${g}, ${bl})`;
      }

      // ------------------------------------------------------------------------
      // MAIN ANIMATION LOOP
      // ------------------------------------------------------------------------
      let lastTimestamp = 0;

      function gameLoop(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const dt = Math.min(0.05, (timestamp - lastTimestamp) / 1000);
        lastTimestamp = timestamp;

        update(dt);

        ctx.save();
        if (state.shakeTime > 0) {
          const sx = Math.round((Math.random() - 0.5) * 2 * state.shakeMag);
          const sy = Math.round((Math.random() - 0.5) * 2 * state.shakeMag);
          ctx.translate(sx, sy);
        }

        if (state.scene === SCENES.SURFACE_LAUNCH) {
          drawScene1SurfaceLaunch();
        } else if (state.scene === SCENES.SPACE_TRANSIT) {
          drawScene2SpaceTransit();
        } else {
          drawSkyAndAtmosphere();
          draw25DOcean();
          drawParticles();
          drawParachuteAndCapsule();
        }

        ctx.restore();

        // Smooth scene-to-scene crossfade curtain
        if (state.transitionAlpha > 0.005) {
          ctx.fillStyle = `rgba(2, 4, 12, ${Math.min(1, state.transitionAlpha)})`;
          ctx.fillRect(0, 0, VW, VH);
        }

        renderCRTShader(state.time);
        localizeEnding();
        requestAnimationFrame(gameLoop);
      }

      // ------------------------------------------------------------------------
      // UI EVENT LISTENERS
      // ------------------------------------------------------------------------
      btnOriginMoon.addEventListener('click', () => {
        audio.ensureContext();
        audio.playBeep(660, 0.07, 'square', 0.07);
        setOrigin(ORIGINS.MOON);
      });

      btnOriginMars.addEventListener('click', () => {
        audio.ensureContext();
        audio.playBeep(440, 0.07, 'square', 0.07);
        setOrigin(ORIGINS.MARS);
      });

      btnSwitchOrigin.addEventListener('click', () => {
        audio.ensureContext();
        const nextOrigin = state.origin === ORIGINS.MOON ? ORIGINS.MARS : ORIGINS.MOON;
        setOrigin(nextOrigin);
      });

      btnAudio.addEventListener('click', () => {
        const isOn = audio.toggle();
        btnAudio.textContent = isOn ? 'SOUND: ON' : 'SOUND: OFF';
        showToast(isOn ? 'RETRO SYNTH AUDIO ENABLED' : 'AUDIO MUTED');
      });

      btnSkip.addEventListener('click', () => {
        skipToVictory();
      });

      btnReplay.addEventListener('click', () => {
        audio.ensureContext();
        audio.playBeep(523.25, 0.08, 'square', 0.08);
        resetSequence();
      });

      btnContinue.addEventListener('click', () => {
        if (state.phase !== PHASES.VICTORY) return;
        window.parent.postMessage({type:'silent-ending-restart'},window.location.origin);
      });

      window.addEventListener('keydown', (e) => {
        if ((e.key === 'Enter' || e.key === ' ') &&
          state.scene === SCENES.EARTH_LANDING && state.phase === PHASES.VICTORY) {
          e.preventDefault();
          btnContinue.click();
        } else if (e.key.toLowerCase() === 'm') btnAudio.click();
      });

      window.addEventListener('resize', resizeCanvas);

      // ------------------------------------------------------------------------
      // BOOTSTRAP ON WINDOW LOAD
      // ------------------------------------------------------------------------
      window.onload = () => {
        initCRTShader();
        resizeCanvas();
        resetSequence();
        // Moon/Mars already completed boarding and departure in the main
        // surface animation. Begin with the return flight to avoid replaying
        // the exact same takeoff twice.
        if(urlParams.get('start')==='transit')enterScene(SCENES.SPACE_TRANSIT);
        requestAnimationFrame(gameLoop);
      };
    })();
  </script>

</body></html>
